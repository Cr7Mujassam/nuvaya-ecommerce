spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
      idle-timeout: 30000
      max-lifetime: 240000
      connection-timeout: 20000
      connection-init-sql: "SET lock_timeout = '5s'; SET statement_timeout = '30s';"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        temp:
          use_jdbc_metadata_defaults: false
    show-sql: false
  h2:
    console:
      enabled: false

spring:
  mail:
    host: ${MAIL_HOST:smtp.zoho.in}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
nuvaya:
  admin:
    notification-email: ${ADMIN_NOTIFICATION_EMAIL:modest.fashion@nuvaya.co.in}

server:
  port: ${PORT:8083}

spring:
  mail:
    host: ${MAIL_HOST:smtp.zoho.in}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  application:
    name: nuvaya-backend
  datasource:
    url: jdbc:h2:file:${NUVAYA_DB_PATH:./data/nuvaya};DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: ${H2_DB_USER:sa}
    password: ${H2_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

nuvaya:
  jwt:
    secret: ${JWT_SECRET:NuvayaModestFashionSuperSecretKey2026HyderabadIndiaMinimum32Chars!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://nuvaya.co.in,https://www.nuvaya.co.in}
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8083}
  admin:
    default-username: ${ADMIN_USERNAME:admin}
    default-password: ${ADMIN_PASSWORD:Nuvaya@2026!}
  store:
    default-whatsapp: ${WHATSAPP_NUMBER:919000000000}
